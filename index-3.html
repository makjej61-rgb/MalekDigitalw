<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malek Digital</title>
<style>
:root{--bg:#000;--card:#141414;--tx:#fff;--mu:#9a9a9a;--ac:#8a4dff;--gr:#1fa13a;--ok:#12a150;--bad:#d93a3a;--bd:#262626;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:640px;margin-inline:auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{gap:10px}.top span{margin-inline-start:auto}#tb{background:rgba(0,0,0,.35);border-radius:99px;padding:4px 12px;font-weight:700!important;font-size:14px}
.hb{background:none;border:0;font-size:28px;line-height:1;padding:0 4px;color:#fff}
#dim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none}
#dim.o{display:block}
#dr{position:fixed;top:0;bottom:0;right:0;width:min(80vw,330px);background:#000;z-index:21;transform:translateX(100%);transition:transform .25s;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--bd)}
#dr.o{transform:none}
#dr .lg{width:84px;height:84px;border-radius:50%;display:block;margin:0 auto 10px}
#dr .nm{text-align:center;font-size:20px;font-weight:700}
#dr .nm small{color:var(--mu);font-size:13px;font-weight:400}
#dr .bl{text-align:center;color:#ff5a5a;font-size:24px;font-weight:700;margin:6px 0 12px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
#dr .it{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-radius:0;padding:15px 8px;font-size:18px;text-align:right}
#dr .it i{font-style:normal;font-size:22px;width:30px;text-align:center}
.cc{background:linear-gradient(115deg,#5b2ca8 0%,#2b5fa0 45%,#139aa0 75%,#00ffb0 100%);border-radius:18px;padding:22px;margin:10px 0}
.cc .t{color:#c9d6ff;font-weight:700;font-size:18px}
.cc .s{color:#b4f3e6;font-weight:600;margin:14px 0 8px}
.cc input{width:100%;background:rgba(0,0,0,.28);border:0;border-radius:12px;padding:13px;color:#fff;font:inherit;font-size:17px;letter-spacing:2px;text-align:center;direction:ltr}
.cc input::placeholder{color:rgba(255,255,255,.55)}
.cc button{width:100%;margin-top:10px;background:#fff;color:#0b4f4a;border:0;font-weight:700}
.wb{width:100%;display:block;border-radius:16px;margin:6px 0}
.pm{border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.pm .ic{width:64px;height:64px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:30px;border:3px solid rgba(0,0,0,.35)}
.pm b{background:rgba(255,255,255,.93);color:#111;border-radius:6px;padding:1px 8px;font-size:15px}
.pm .ps{background:rgba(255,255,255,.93);color:#222;border-radius:6px;padding:1px 8px;font-size:13px}
.pt1{font-size:28px;font-weight:700;margin:14px 0 10px}
.pf{width:100%;background:#1b1b1b;border:0;border-radius:40px;padding:18px 24px;margin:8px 0;color:#fff;font:inherit;font-size:16px}
.pw{position:relative}.pw .cu{position:absolute;left:22px;top:50%;transform:translateY(-50%);font-size:20px;font-style:italic;color:#ccc}
.pg{background:#0d1f10;border-radius:40px;padding:12px 24px;margin:8px 0;color:#6fcf8c}
.pg small{display:block;color:#9ab;font-size:13px}.pg b{font-size:22px}
.pa{display:flex;align-items:center;gap:10px}.pa .pf{flex:1;color:#aaa}
.pa button{background:none;border:0;font-size:26px;padding:4px}
.pbtn{width:100%;background:#5b3ba8;border:0;border-radius:40px;padding:18px;font-size:17px;font-weight:700;margin-top:14px;color:#fff}
.pbtn:disabled{opacity:.5}
.top{position:sticky;top:0;z-index:5;background:var(--ac);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.top small{font-weight:400;opacity:.9}
.wrap{padding:0 14px}
#q{width:100%;background:#151515;border:0;border-radius:40px;padding:16px 22px;margin:16px 0 8px;font:inherit;font-size:17px;color:var(--tx)}
#q::placeholder{color:#aaa}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;margin-top:14px}
.cat{text-align:center;cursor:pointer}
.img{position:relative;height:118px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 35%),radial-gradient(circle at 85% 90%,rgba(255,255,255,.25),transparent 40%),linear-gradient(160deg,#2fbf4a,#127a2a);display:flex;align-items:center;justify-content:center;font-size:54px}
.img span.l{position:absolute;bottom:8px;left:0;right:0;background:rgba(31,161,58,.9);font-size:13px;font-weight:700;padding:2px 0}
.cat b{display:block;margin-top:10px;font-size:17px}
button,input,select,textarea{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac)}button.ok{background:var(--ok);border-color:var(--ok)}button.bad{background:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5}
.in{width:100%;background:#151515;border:1px solid var(--bd);border-radius:12px;padding:12px;margin:5px 0}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mu{color:var(--mu);font-size:13px}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);white-space:nowrap}
.pending{color:#e5a800}.done{color:#3ddc7a}.rejected{color:#ff6b6b}
.msg{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:14px;right:14px;max-width:612px;margin:auto;z-index:30;background:var(--ac);padding:12px 14px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.5);font-weight:700}
h2{font-size:16px;margin:18px 0 6px}
.back{background:none;border:0;color:var(--mu);padding:8px 0;margin-top:8px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:auto;background:#0b0b0b;border-top:1px solid var(--bd);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;background:none;border:0;color:var(--mu);font-size:12px;padding:4px}
.nav button.on{color:#fff}.nav i{display:block;font-style:normal;font-size:20px}
#sup{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#14d86a;display:none;align-items:center;justify-content:center;font-size:28px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:6}
.tk{overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,#1b0f3a,#2a1560);border-bottom:1px solid var(--bd);padding:9px 0;font-size:15px;color:#e8e0ff}
.tk span{display:inline-block;padding-left:100%;animation:tk 20s linear infinite}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-100%)}}
</style>
</head>

async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const norm=c=>c.toUpperCase().replace(/[^A-Z0-9]/g,'');
function compress(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;const M=900;if(Math.max(w,h)>M){const k=M/Math.max(w,h);w*=k;h*=k}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);let q=.7,d=c.toDataURL('image/jpeg',q);while(d.length>170000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}res(d)};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

const SB=supabase.createClient('https://hpdgnmdpbwuvmgzsiqmc.supabase.co','sb_publishable_A-8UC0Ah1jZua6mUXVXCpg_xB6nhcHt');
const ST={pending:'قيد المراجعة',done:'تم',rejected:'مرفوض'};
let me=null,prof={},products=[],methods=[],S={},reqs=[],names={},tab='shop',cat=null,buying=null,payM=null,rcpt=null,menuOpen=false,infoKey='',note='',imgCache={},newCodes=[],authSign=false;
const bal=()=>Number(prof.balance||0),rate=()=>Number(S.rate)||0,money=n=>'$'+Number(n).toFixed(2);
function toast(t){note=t;render();setTimeout(()=>{note='';render()},3500)}
async function init(){
  const {data}=await SB.auth.getSession();me=data.session?.user||null;
  if(me)await refresh();else render();
}
async function refresh(){
  const [p,pr,m,s,r]=await Promise.all([
    SB.from('profiles').select('*').eq('id',me.id).single(),
    SB.from('products').select('*').order('id'),
    SB.from('methods').select('*').order('sort'),
    SB.from('settings').select('*'),
    SB.from('requests').select('*').order('created_at',{ascending:false}).limit(300)]);
  prof=p.data||{};products=pr.data||[];methods=m.data||[];
  S=Object.fromEntries((s.data||[]).map(x=>[x.key,x.value]));reqs=r.data||[];
  if(prof.is_admin){const n=await SB.from('profiles').select('id,name');names=Object.fromEntries((n.data||[]).map(x=>[x.id,x.name]))}
  render();
}
async function auth(){
  const email=$('#em').value.trim(),pw=$('#pw').value;
  if(!email||pw.length<6)return toast('أدخل البريد وكلمة سر من 6 أحرف على الأقل');
  const r=authSign?await SB.auth.signUp({email,password:pw,options:{data:{name:($('#nm')?.value||'').trim()}}}):await SB.auth.signInWithPassword({email,password:pw});
  if(r.error)return toast('خطأ: '+r.error.message);
  if(!r.data.session)return toast('تحقق من بريدك لتفعيل الحساب ثم سجّل الدخول');
  me=r.data.user;await refresh();
}
async function logout(){await SB.auth.signOut();me=null;prof={};menuOpen=false;tab='shop';render()}

function render(){
  const m=$('#main'),keep={};
  m.querySelectorAll('input:not([type=file]),select,textarea').forEach(e=>{if(e.id)keep[e.id]=e.value});
  const on=!!me,adm=on&&prof.is_admin;
  $('#tb').textContent=on?'رصيدك '+money(bal()):'';
  $('.hb').style.visibility=on?'visible':'hidden';
  $('#nav').style.display=on?'flex':'none';
  $('#q').style.display=on&&tab==='shop'?'block':'none';
  const tabs=[['shop','المتجر','🏠'],['wallet','المحفظة','💳'],['mine','طلباتي','📋']];
  if(adm)tabs.push(['admin','الإدارة','⚙️']);
  $('#nav').innerHTML=tabs.map(([k,l,i])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('');
  const tx=S.ticker===undefined?'👑 أهلاً بك في Malek Digital — شحن فوري وآمن لجميع الألعاب والخدمات':S.ticker,tk=$('#tk'),ts=$('#tks');
  tk.style.display=on&&tx?'block':'none';
  if(tx&&ts.textContent!==tx){ts.textContent=tx;ts.style.animationDuration=Math.max(14,tx.length*0.28)+'s'}
  const s=$('#sup');s.style.display=on&&S.support?'flex':'none';if(S.support)s.href=S.support;
  let h=note?`<div class="msg">${esc(note)}</div>`:'';
  h+=on?({shop,wallet,mine,admin:adminView,pays,mywallet,infoPage}[tab]||shop)():authView();
  m.innerHTML=h;
  Object.entries(keep).forEach(([k,v])=>{const e=document.getElementById(k);if(e)e.value=v});
  drawer();
}
function authView(){
  return `<div class="pt1" style="text-align:center">${authSign?'إنشاء حساب':'تسجيل الدخول'}</div>
  ${authSign?'<input class="pf" id="nm" placeholder="الاسم">':''}
  <input class="pf" id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="email" style="direction:ltr;text-align:right">
  <input class="pf" id="pw" type="password" placeholder="كلمة السر (6 أحرف على الأقل)" style="direction:ltr;text-align:right">
  <button class="pbtn" onclick="auth()">${authSign?'إنشاء حساب':'دخول'}</button>
  <button class="back" style="width:100%;text-align:center" onclick="authSign=!authSign;render()">${authSign?'عندي حساب، تسجيل الدخول':'ما عندي حساب، إنشاء حساب'}</button>`;
}
function menu(o){menuOpen=o;drawer()}
function go(k){
  if(k.startsWith('i:')){tab='info';infoKey=k.slice(2)}else tab=k;
  if(k==='shop'){cat=null;$('#q').value=''}
  buying=null;payM=null;menuOpen=false;render();window.scrollTo(0,0);
}
function drawer(){
  const it=[['shop','الرئيسية','🏠'],['wallet','اضافة رصيد','➕'],['pays','دفعاتي','💵'],['mywallet','محفظتي','👛'],['mine','طلباتي','🛒'],['i:agents','وكلاؤنا','🎧'],['i:safety','الحماية','🛡️'],['i:kyc','تحقق الهوية','✅'],['i:about','من نحن','ℹ️']];
  if(prof.is_admin)it.push(['admin','الإدارة','⚙️']);
  $('#dr').className=menuOpen?'o':'';$('#dim').className=menuOpen?'o':'';
  $('#dr').innerHTML=`<img class="lg" src="${LOGO}" alt=""><div class="nm">${esc(prof.name||'عميل')} <small>#${esc(String(me?.id||'').slice(0,5))}</small></div><div class="bl">$ ${bal().toFixed(2)}</div>`+
    it.map(([k,l,i])=>`<button class="it" onclick="go('${k}')"><i>${i}</i>${l}</button>`).join('')+
    `<button class="it" onclick="logout()"><i>🚪</i>تسجيل الخروج</button>`;
}

function shop(){
  const q=$('#q').value.trim().toLowerCase();
  if(!q&&!cat)return '<div class="grid">'+CATS.map(([k,n,i])=>`<div class="cat" onclick="cat='${k}';render()"><div class="img" ${IMG[k]?`style="background:#000 url(${IMG[k]}) center/contain no-repeat"`:''}>${IMG[k]?'':i+'<span class="l">'+n+'</span>'}</div><b>${n}</b></div>`).join('')+'</div>';
  const l=products.filter(p=>q?(p.name+' '+p.game).toLowerCase().includes(q):p.cat===cat);
  const title=cat&&!q?CATS.find(c=>c[0]===cat)[1]:'نتائج البحث';
  let h=`<button class="back" onclick="cat=null;$('#q').value='';render()">← رجوع</button><h2>${title}</h2>`;
  h+=l.length?l.map(p=>`<div class="c"><div class="row"><div><b>${esc(p.icon||'🎮')} ${esc(p.name)}</b><div class="mu">${esc(p.game)}</div></div><div style="text-align:left"><b>${money(p.price)}</b><br><button class="p" style="margin-top:6px" onclick="buying=${p.id};render()">شراء</button></div></div></div>`).join(''):'<div class="c mu">لا توجد منتجات هنا بعد.</div>';
  return h+(buying?buyBox():'');
}
function buyBox(){
  const p=products.find(x=>x.id==buying);if(!p)return '';
  const low=bal()<p.price;
  return `<div class="c" style="border-color:var(--ac)"><b>شراء: ${esc(p.name)}</b> <span class="mu">(${esc(p.game)})</span>
  <input class="in" id="pid" placeholder="معرّف اللاعب / الرقم / الحساب">
  ${low?'<div style="color:#ff6b6b;font-size:13px">رصيدك غير كافٍ، اشحن محفظتك أولاً.</div>':''}
  <div class="row" style="margin-top:6px"><button class="p" ${low?'disabled':''} onclick="buy()">تأكيد الطلب ${money(p.price)}</button><button onclick="buying=null;render()">إلغاء</button></div></div>`;
}
async function buy(){
  const p=products.find(x=>x.id==buying),pid=$('#pid').value.trim();
  if(!pid)return toast('أدخل المعرّف');
  const r=await SB.from('requests').insert({type:'order',pname:p.name,game:p.game,price:p.price,player_id:pid});
  if(r.error)return toast('تعذر إرسال الطلب: '+r.error.message);
  buying=null;tab='mine';await refresh();toast('تم إرسال الطلب');
}

function wallet(){
  const m=methods.find(x=>x.id==payM);
  let h=`<div class="cc"><div class="t">Credit Card Malek Digital</div><div class="s">ادخال كود الشحن</div><input id="code" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters"><button onclick="redeem()">شحن</button></div>`;
  if(m){
    const sy=m.syp&&rate()>0;
    return h+`<button class="back" onclick="payM=null;rcpt=null;render()">← رجوع</button>
    <div class="pt1">${esc(m.title||('شحن عبر '+m.sub))}</div>
    ${m.min_text?`<div class="mu" style="font-size:15px;margin:8px 0">${esc(m.min_text)}</div>`:''}
    ${m.acct?`<div style="font-size:22px;font-weight:700;letter-spacing:1px;margin:12px 0;direction:ltr;text-align:right" onclick="getSelection().selectAllChildren(this)">${esc(m.acct)}</div>`:''}
    <div class="mu" style="white-space:pre-wrap;font-size:15px;line-height:1.8;margin:10px 0">${esc(m.note||S.pay||'تواصل مع الدعم للحصول على بيانات التحويل.')}</div>
    <input class="pf" id="ref" placeholder="ادخل رقم العملية هنا">
    ${sy?`<div class="pw"><input class="pf" id="amt" type="number" min="1" step="any" placeholder="القيمة" oninput="upd()"><span class="cu">${esc(m.sub)}</span></div><div class="pg"><small>القيمة التي سيتم ارسالها</small><b id="usd">0</b> $</div>`:`<input class="pf" id="amt" type="number" min="1" step="any" placeholder="القيمة بالدولار">`}
    <div style="position:relative;margin:8px 0"><div class="pf" style="margin:0;display:flex;justify-content:space-between;align-items:center"><span>${rcpt?'✓ تم اختيار الصورة':'اشعار (اضغط لاختيار صورة من الاستوديو)'}</span><span style="font-size:26px">📎</span></div><input type="file" id="rf" accept="image/*" onchange="pick(this)" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer"></div>
    ${rcpt?`<img src="${rcpt}" style="width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#111">`:''}
    <div class="mu" style="font-size:12px;margin-top:4px">الصورة تُستخدم للتحقق من التحويل فقط ولا يراها غيرك وصاحب المتجر.</div>
    <button class="pbtn" onclick="topup()">طلب</button>`;
  }
  h+='<h2>طرق الشحن</h2>';
  if(!methods.length)return h+'<div class="c mu">لم تُضف طرق شحن بعد.</div>';
  return h+'<div class="grid" style="margin-top:6px">'+methods.map(x=>`<div class="pm" style="${MIMG[x.name]?`background:#000 url(${MIMG[x.name]}) center/contain no-repeat;min-height:170px`:`background:linear-gradient(135deg,${esc(x.c1)},${esc(x.c2)})`}" onclick="payM=${x.id};render()">${MIMG[x.name]?'':`<div class="ic">${esc(x.icon||'💳')}</div><b>${esc(x.name)}</b><span class="ps">${esc(x.sub)}</span>`}</div>`).join('')+'</div>';
}
function upd(){const v=parseFloat($('#amt').value)||0;$('#usd').textContent=rate()>0?Math.round(v/rate()*100)/100:0}
async function pick(el){const f=el.files[0];if(!f)return;try{rcpt=await compress(f);render()}catch(e){rcpt=null;toast('تعذر قراءة الصورة')}}
async function redeem(){
  const c=$('#code').value.trim();if(norm(c).length<8)return toast('أدخل كود الشحن كاملاً');
  const r=await SB.rpc('redeem_code',{p_code:c});
  if(r.error)return toast(r.error.message.includes('invalid_code')?'الكود غير صالح أو مستخدم':'تعذر الشحن: '+r.error.message);
  await refresh();toast('تمت إضافة '+money(r.data)+' لرصيدك');
}
async function topup(){
  const m=methods.find(x=>x.id==payM);if(!m)return;
  const ref=$('#ref').value.trim(),v=parseFloat($('#amt').value),sy=m.syp&&rate()>0,amount=sy?Math.round(v/rate()*100)/100:v;
  if(!ref||!(v>0)||!(amount>0))return toast('أدخل رقم العملية والقيمة');
  if(!rcpt)return toast('ارفع صورة الإشعار');
  try{
    const path=me.id+'/'+Date.now()+'.jpg';
    const u=await SB.storage.from('receipts').upload(path,await (await fetch(rcpt)).blob(),{contentType:'image/jpeg'});
    if(u.error)throw u.error;
    const r=await SB.from('requests').insert({type:'topup',amount,syp:sy?v:null,method:m.name,ref,receipt_path:path});
    if(r.error)throw r.error;
    payM=null;rcpt=null;tab='mine';await refresh();toast('تم إرسال طلب الشحن، بانتظار التأكيد');
  }catch(e){toast('تعذر الإرسال: '+(e.message||''))}
}

function reqCard(r,adm){
  const t=r.type==='code'?`🎟️ كود شحن ${money(r.amount)}`:r.type==='order'?`🛒 ${esc(r.pname)} · ${esc(r.game)} · ${money(r.price)}<div class="mu">ID: ${esc(r.player_id)}</div>`:`💰 شحن رصيد ${money(r.amount)}${r.method?' · '+esc(r.method):''}${r.syp?' ('+r.syp+' ل.س)':''}<div class="mu">عملية: ${esc(r.ref)}</div>`;
  const im=adm&&r.receipt_path?(imgCache[r.id]?`<img src="${imgCache[r.id]}" style="width:100%;border-radius:10px;margin-top:8px">`:`<button style="margin-top:8px" onclick="showImg('${r.id}','${esc(r.receipt_path)}')">عرض الإشعار</button>`):'';
  const acts=adm&&r.status==='pending'?`<div class="row" style="margin-top:8px"><button class="ok" onclick="decide('${r.id}',true)">${r.type==='order'?'تم التنفيذ':'قبول'}</button><button class="bad" onclick="decide('${r.id}',false)">رفض</button></div>`:'';
  return `<div class="c"><div class="row"><div>${t}${adm?`<div class="mu">${esc(names[r.user_id]||'')}</div>`:''}${r.note?`<div class="mu">${esc(r.note)}</div>`:''}</div><span class="tag ${r.status}">${ST[r.status]}</span></div>${im}${acts}</div>`;
}
const mineR=()=>reqs.filter(r=>r.user_id===me.id);
function mine(){const l=mineR();return '<h2>طلباتي</h2>'+(l.length?l.map(r=>reqCard(r,false)).join(''):'<div class="c mu">لا توجد طلبات.</div>')}
function pays(){const l=mineR().filter(r=>r.type!=='order');return '<h2>دفعاتي</h2>'+(l.length?l.map(r=>reqCard(r,false)).join(''):'<div class="c mu">لا توجد دفعات.</div>')}
function mywallet(){
  const l=mineR().filter(r=>r.status==='done');
  return `<h2>محفظتي</h2><div class="c row"><span>الرصيد الحالي</span><b style="font-size:22px">${money(bal())}</b></div><button class="p" style="width:100%" onclick="go('wallet')">اضافة رصيد</button><h2>العمليات المنفذة</h2>`+(l.length?l.map(r=>reqCard(r,false)).join(''):'<div class="c mu">لا توجد عمليات بعد.</div>');
}
function infoPage(){
  const T={agents:'وكلاؤنا',safety:'الحماية',kyc:'تحقق الهوية',about:'من نحن'},t=S[infoKey];
  return `<h2>${T[infoKey]||''}</h2><div class="c" style="white-space:pre-wrap">${t?esc(t):'<span class="mu">قريباً.</span>'}</div>`;
}

async function decide(id,ok){
  const r=await SB.rpc('admin_decide',{p_id:id,p_ok:ok});
  if(r.error)return toast('فشل التنفيذ: '+r.error.message);
  await refresh();if(r.data==='insufficient')toast('رصيد الزبون غير كافٍ، تم رفض الطلب');
}
async function showImg(id,path){
  const r=await SB.storage.from('receipts').createSignedUrl(path,600);
  if(r.error)return toast('تعذر تحميل الإشعار');imgCache[id]=r.data.signedUrl;render();
}
function adminView(){
  const pend=reqs.filter(r=>r.status==='pending');
  return `<h2>طلبات بانتظار الإجراء (${pend.length})</h2>`+(pend.map(r=>reqCard(r,true)).join('')||'<div class="c mu">لا يوجد شيء معلّق.</div>')+
  `<h2>طرق الشحن</h2><div class="c"><input class="in" id="mn" placeholder="الاسم (مثال: SHAM CASH)"><input class="in" id="ms" placeholder="الوصف (مثال: تحويل شام كاش)"><input class="in" id="mi" placeholder="إيموجي (اختياري)"><select class="in" id="mc">${MC.map(([n,v])=>`<option value="${v}">${n}</option>`).join('')}</select><textarea class="in" id="mt" rows="3" placeholder="تعليمات التحويل: رقم الحساب أو العنوان..."></textarea><button class="p" onclick="addMethod()">إضافة طريقة</button></div>`+
  methods.map(m=>`<div class="c"><b>${esc(m.icon||'💳')} ${esc(m.name)}</b> <span class="mu">${esc(m.sub)}</span><textarea class="in" id="n_${m.id}" rows="2" placeholder="تعليمات التحويل">${esc(m.note)}</textarea><div class="row"><button class="p" onclick="saveNote(${m.id})">حفظ التعليمات</button><button class="bad" onclick="delMethod(${m.id})">حذف</button></div></div>`).join('')+
  `<h2>أكواد الشحن</h2><div class="c"><input class="in" id="cv" type="number" step="any" placeholder="قيمة الكود بالدولار"><input class="in" id="cn" type="number" min="1" max="50" placeholder="عدد الأكواد (حتى 50)"><button class="p" onclick="genCodes()">إنشاء أكواد</button>${newCodes.length?`<div class="mu" style="margin-top:8px">انسخها الآن، لن تظهر مرة ثانية:</div><textarea class="in" readonly rows="${Math.min(newCodes.length,8)+1}" onclick="this.select()">${newCodes.join('\n')}</textarea>`:''}</div>`+
  `<h2>إضافة منتج</h2><div class="c"><select class="in" id="pc">${CATS.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><input class="in" id="pn" placeholder="اسم المنتج (مثال: 660 UC)"><input class="in" id="pg" placeholder="اللعبة / الخدمة"><input class="in" id="pp" type="number" step="any" placeholder="السعر بالدولار"><input class="in" id="pi" placeholder="إيموجي (اختياري)"><button class="p" onclick="addProd()">إضافة</button></div>`+
  products.map(p=>`<div class="c row"><span>${esc(p.icon||'🎮')} ${esc(p.name)} · ${money(p.price)}<div class="mu">${esc(CATS.find(c=>c[0]===p.cat)?.[1]||'بدون قسم')}</div></span><button class="bad" onclick="delProd(${p.id})">حذف</button></div>`).join('')+
  `<h2>إعدادات المتجر</h2><div class="c"><div class="mu">شريط الأخبار المتحرك (اتركه فارغاً لإخفائه)</div><textarea class="in" id="s_ticker" rows="2">${esc(S.ticker===undefined?'👑 أهلاً بك في Malek Digital — شحن فوري وآمن لجميع الألعاب والخدمات':S.ticker)}</textarea><div class="mu">تعليمات الدفع العامة</div><textarea class="in" id="s_pay" rows="3">${esc(S.pay)}</textarea><div class="mu">رابط الدعم (واتساب أو تيليجرام)</div><input class="in" id="s_support" value="${esc(S.support)}" placeholder="https://wa.me/..."><div class="mu">سعر الصرف: كم ليرة سورية جديدة بالدولار الواحد</div><input class="in" id="s_rate" type="number" step="any" value="${esc(S.rate)}" placeholder="مثال: 120"><div class="mu">وكلاؤنا</div><textarea class="in" id="s_agents" rows="3">${esc(S.agents)}</textarea><div class="mu">الحماية</div><textarea class="in" id="s_safety" rows="3">${esc(S.safety)}</textarea><div class="mu">تحقق الهوية</div><textarea class="in" id="s_kyc" rows="3">${esc(S.kyc)}</textarea><div class="mu">من نحن</div><textarea class="in" id="s_about" rows="3">${esc(S.about)}</textarea><button class="p" onclick="saveSet()">حفظ</button></div>`;
}
async function run(p,okMsg){const r=await p;if(r.error)return toast('تعذر التنفيذ: '+r.error.message);await refresh();if(okMsg)toast(okMsg)}
function addProd(){
  const name=$('#pn').value.trim(),game=$('#pg').value.trim(),price=parseFloat($('#pp').value);
  if(!name||!game||!(price>0))return toast('أكمل الحقول');
  run(SB.from('products').insert({name,game,price,cat:$('#pc').value,icon:$('#pi').value.trim()||'🎮'}));
  ['pn','pg','pp','pi'].forEach(i=>$('#'+i).value='');
}
function delProd(id){run(SB.from('products').delete().eq('id',id))}
function addMethod(){
  const name=$('#mn').value.trim();if(!name)return toast('أدخل الاسم');
  const [c1,c2]=$('#mc').value.split(',');
  run(SB.from('methods').insert({name,sub:$('#ms').value.trim(),icon:$('#mi').value.trim()||'💳',c1,c2,note:$('#mt').value,sort:methods.length+1}));
  ['mn','ms','mi','mt'].forEach(i=>$('#'+i).value='');
}
function saveNote(id){run(SB.from('methods').update({note:$('#n_'+id).value}).eq('id',id),'تم الحفظ')}
function delMethod(id){run(SB.from('methods').delete().eq('id',id))}
function saveSet(){
  let u=$('#s_support').value.trim();if(u&&!/^https?:\/\//.test(u))u='';
  const rows=[['ticker',$('#s_ticker').value],['pay',$('#s_pay').value],['support',u],['rate',$('#s_rate').value],['agents',$('#s_agents').value],['safety',$('#s_safety').value],['kyc',$('#s_kyc').value],['about',$('#s_about').value]].map(([key,value])=>({key,value}));
  run(SB.from('settings').upsert(rows),'تم الحفظ');
}
async function genCodes(){
  const v=parseFloat($('#cv').value),n=parseInt($('#cn').value||'1');
  if(!(v>0)||!(n>=1&&n<=50))return toast('أدخل القيمة وعدداً من 1 إلى 50');
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',out=[],rows=[];
  for(let i=0;i<n;i++){let c='';crypto.getRandomValues(new Uint8Array(12)).forEach(x=>c+=A[x%32]);rows.push({code_hash:await sha(c),value:v});out.push(c.match(/.{4}/g).join('-'))}
  const r=await SB.from('codes').insert(rows);
  if(r.error)return toast('تعذر إنشاء الأكواد: '+r.error.message);
  newCodes=out;render();
}
init();
</script>
</body>
</html>
