async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

function toast(t){note=t;render();setTimeout(()=>{note='';render()},3500)}
async function init(){
  const {data}=await SB.auth.getSession();me=data.session?.user||null;
  if(me){try{const c=JSON.parse(localStorage.getItem('mdc')||'null');if(c&&c.uid===me.id){prof=c.prof||{};products=c.products||[];methods=c.methods||[];S=c.S||{}}}catch(e){}}
  render();

}
async function refresh(){
  const [p,pr,m,s,r]=await Promise.all([
    SB.from('profiles').select('*').eq('id',me.id).single(),
    SB.from('products').select('*').order('id'),
    SB.from('methods').select('*').order('sort'),
    SB.from('settings').select('*'),
    SB.from('requests').select('*').order('created_at',{ascending:false}).limit(300)]);
  prof=p.data||{};products=pr.data||[];methods=m.data||[];
  S=Object.fromEntries((s.data||[]).map(x=>[x.key,x.value]));reqs=r.data||[];
  try{localStorage.setItem('mdc',JSON.stringify({uid:me.id,prof,products,methods,S}))}catch(e){}
  if(prof.is_admin){const [n,nt]=await Promise.all([SB.from('profiles').select('id,name,email,balance,banned').order('created_at',{ascending:false}),SB.from('customer_notes').select('*')]);custs=n.data||[];names=Object.fromEntries(custs.map(x=>[x.id,x.name||x.email||'']));notes=Object.fromEntries((nt.data||[]).map(x=>[x.user_id,x.note]));seen=new Set(reqs.filter(x=>x.status==='pending').map(x=>x.id));sig=reqSig()}
  render();
}
async function auth(){
  const email=$('#em').value.trim(),pw=$('#pw').value;
  if(!email||pw.length<6)return toast('أدخل البريد وكلمة سر من 6 أحرف على الأقل');
  const r=authSign?await SB.auth.signUp({email,password:pw,options:{data:{name:($('#nm')?.value||'').trim()}}}):await SB.auth.signInWithPassword({email,password:pw});
  if(r.error)return toast('خطأ: '+r.error.message);
  if(!r.data.session)return toast('تحقق من بريدك لتفعيل الحساب ثم سجّل الدخول');
  me=r.data.user;await refresh();
}

function menu(o){menuOpen=o;drawer()}

const syp=v=>(Math.round(v*rate()*100)/100).toLocaleString('en')+' SY';
let grp=null,GL=[];
const GIMG={};
function gimg(g){g=(g||'').toLowerCase();const k=Object.keys(GIMG).find(x=>g.includes(x));return k?GIMG[k]:''}
function gstyle(g){const i=gimg(g);if(i)return `background:#000 url(${i}) center/cover no-repeat`;let h=0;for(const c of (g||''))h=(h*31+c.charCodeAt(0))%360;return `background:linear-gradient(135deg,hsl(${h},65%,42%),hsl(${(h+50)%360},70%,18%))`}

function shop(){
  const q=$('#q').value.trim().toLowerCase();
  if(!q&&!cat)return '<div class="grid">'+CATS.map(([k,n,i])=>`<div class="cat" onclick="cat='${k}';grp=null;render()"><div class="img" ${IMG[k]?`style="background:#000 url(${IMG[k]}) center/contain no-repeat"`:''}>${IMG[k]?'':i+'<span class="l">'+n+'</span>'}</div><b>${n}</b></div>`).join('')+'</div>';
  const inCat=cat?products.filter(p=>p.cat===cat):[];
  const catName=cat?CATS.find(c=>c[0]===cat)[1]:'';
  if(!q&&grp===null){
    GL=[...new Set(inCat.map(p=>p.game))];
    const hh=`<button class="back" onclick="cat=null;grp=null;render()">← رجوع</button><h2>${catName}</h2>`;
    if(!GL.length)return hh+'<div class="c mu">لا توجد منتجات هنا بعد.</div>';
    return hh+'<div class="grid pg2">'+GL.map((g,i)=>`<div class="pc" onclick="grp=GL[${i}];render()"><div class="pi" style="${gstyle(g)}">${gimg(g)?'':`<span>${esc(g)}</span>`}</div><div class="pn">${esc(g)}</div><div class="mu">${inCat.filter(p=>p.game===g).length} باقة</div></div>`).join('')+'</div>';
  }
  const l=q?products.filter(p=>(p.name+' '+p.game).toLowerCase().includes(q)):inCat.filter(p=>p.game===grp);
  let h=q?`<button class="back" onclick="$('#q').value='';render()">← رجوع</button><h2>نتائج البحث</h2>`:`<button class="back" onclick="grp=null;render()">← رجوع</button><h2>${esc(grp)}</h2>`;
  h+=l.length?'<div class="grid pg2">'+l.map(p=>`<div class="pc" onclick="buying=${p.id};render()"><div class="pi" style="${gstyle(p.game)}">${gimg(p.game)?'':`<span>${esc(p.game)}</span>`}</div><div class="pn">${esc(p.name)}</div><div class="pp">${money(p.price)}</div>${rate()>0?`<div class="sy">${syp(p.price)}</div>`:''}</div>`).join('')+'</div>':'<div class="c mu">لا توجد منتجات هنا بعد.</div>';
  return h+(buying?`<div class="sd" onclick="buying=null;render()"></div><div class="sh">${buyBox()}</div>`:'');
}
function buyBox(){
  const p=products.find(x=>x.id==buying);if(!p)return '';
  const low=bal()<p.price;
  const note=S.buynote===undefined?'يتم تنفيذ طلبك بعد المراجعة، وعادةً خلال دقائق.':S.buynote;
  return `<div class="row" style="align-items:flex-start"><div><div class="pill">${money(p.price)}</div>${rate()>0?`<div class="sy">${syp(p.price)}</div>`:''}</div><div style="text-align:right;font-size:17px;font-weight:700">${esc(p.name)}<div class="mu" style="font-weight:400">${esc(p.game)}</div></div></div>
  <input class="pf" id="pid" placeholder="الايدي" style="margin-top:14px">
  ${low?'<div style="color:#ff6b6b;font-size:13px;text-align:center">رصيدك غير كافٍ، اشحن محفظتك أولاً.</div>':''}
  <div class="row" style="gap:10px;margin-top:12px"><button class="pbtn" style="margin:0;flex:1" ${low?'disabled':''} onclick="buy()">شراء</button><button class="cx" onclick="buying=null;render()">إلغاء</button></div>
  ${note?`<div class="mu" style="margin-top:14px;font-size:14px;text-align:center">${esc(note)}</div>`:''}`;
}
async function buy(){
  const p=products.find(x=>x.id==buying),pid=$('#pid').value.trim();
  if(!pid)return toast('أدخل المعرّف');
  const r=await SB.from('requests').insert({type:'order',product_id:p.id,player_id:pid});
  if(r.error)return toast('تعذر إرسال الطلب: '+r.error.message);
  buying=null;tab='mine';await refresh();toast('تم إرسال الطلب');

    ${m.min_text?`<div class="mu" style="font-size:15px;margin:8px 0">${esc(m.min_text)}</div>`:''}
    ${m.acct?`<div style="font-size:22px;font-weight:700;letter-spacing:1px;margin:12px 0;direction:ltr;text-align:right" onclick="getSelection().selectAllChildren(this)">${esc(m.acct)}</div>`:''}
    <div class="mu" style="white-space:pre-wrap;font-size:15px;line-height:1.8;margin:10px 0">${esc(m.note||S.pay||'تواصل مع الدعم للحصول على بيانات التحويل.')}</div>

    <div style="position:relative;margin:8px 0"><div class="pf" style="margin:0;display:flex;justify-content:space-between;align-items:center"><span>${rcpt?'✓ تم اختيار الصورة':'اشعار (اضغط لاختيار صورة من الاستوديو)'}</span><span style="font-size:26px">📎</span></div><input type="file" id="rf" accept="image/*" onchange="pick(this)" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer"></div>

function upd(){const v=parseFloat($('#amt').value)||0;$('#usd').textContent=rate()>0?Math.round(v/rate()*100)/100:0}
async function pick(el){const f=el.files[0];if(!f)return;try{rcpt=await compress(f);render()}catch(e){rcpt=null;toast('تعذر قراءة الصورة')}}
async function redeem(){
  const c=$('#code').value.trim();if(norm(c).length<8)return toast('أدخل كود الشحن كاملاً');
  const r=await SB.rpc('redeem_code',{p_code:c});
  if(r.error)return toast(r.error.message.includes('invalid_code')?'الكود غير صالح أو مستخدم':'تعذر الشحن: '+r.error.message);
  await refresh();toast('تمت إضافة '+money(r.data)+' لرصيدك');
}
async function topup(){
  const m=methods.find(x=>x.id==payM);if(!m)return;
  const ref=$('#ref').value.trim(),v=parseFloat($('#amt').value),sy=m.syp&&rate()>0,amount=sy?Math.round(v/rate()*100)/100:v;
  if(!ref||!(v>0)||!(amount>0))return toast('أدخل رقم العملية والقيمة');
  if(!rcpt)return toast('ارفع صورة الإشعار');
  try{
    const path=me.id+'/'+Date.now()+'.jpg';
    const u=await SB.storage.from('receipts').upload(path,await (await fetch(rcpt)).blob(),{contentType:'image/jpeg'});
    if(u.error)throw u.error;
    const r=await SB.from('requests').insert({type:'topup',amount,syp:sy?v:null,method:m.name,ref,receipt_path:path});
    if(r.error)throw r.error;
    payM=null;rcpt=null;tab='mine';await refresh();toast('تم إرسال طلب الشحن، بانتظار التأكيد');
  }catch(e){toast('تعذر الإرسال: '+(e.message||''))}
}

function reqCard(r,adm){
  const t=r.type==='code'?`🎟️ كود شحن ${money(r.amount)}`:r.type==='order'?`🛒 ${esc(r.pname)} · ${esc(r.game)} · ${money(r.price)}<div class="mu">ID: ${esc(r.player_id)}</div>`:`💰 شحن رصيد ${money(r.amount)}${r.method?' · '+esc(r.method):''}${r.syp?' ('+r.syp+' ل.س)':''}<div class="mu">عملية: ${esc(r.ref)}</div>`;
  const im=adm&&r.receipt_path?(imgCache[r.id]?`<img src="${imgCache[r.id]}" style="width:100%;border-radius:10px;margin-top:8px">`:`<button style="margin-top:8px" onclick="showImg('${r.id}','${esc(r.receipt_path)}')">عرض الإشعار</button>`):'';
  const acts=adm&&r.status==='pending'?`<div class="row" style="margin-top:8px"><button class="ok" onclick="decide('${r.id}',true)">${r.type==='order'?'تم التنفيذ':'قبول'}</button><button class="bad" onclick="decide('${r.id}',false)">رفض</button></div>${r.type==='order'?`<button class="p" style="width:100%;margin-top:6px" onclick="autoFulfil('${r.id}')">${r.supplier_status==='wait'?'🔄 تحديث حالة الطلب':'⚡ تنفيذ تلقائي (النخبة)'}</button>`:''}`:'';
  return `<div class="c"><div class="row"><div>${t}${adm?`<div class="mu">${esc(names[r.user_id]||'')}</div>`:''}${r.note?`<div class="mu">${esc(r.note)}</div>`:''}</div><span class="tag ${r.status}">${ST[r.status]}</span></div>${im}${acts}</div>`;
}

  `<h2>أكواد الشحن</h2><div class="c"><input class="in" id="cv" type="number" step="any" placeholder="قيمة الكود بالدولار"><input class="in" id="cn" type="number" min="1" max="50" placeholder="عدد الأكواد (حتى 50)"><button class="p" onclick="genCodes()">إنشاء أكواد</button>${newCodes.length?`<div class="mu" style="margin-top:8px">انسخها الآن، لن تظهر مرة ثانية:</div><textarea class="in" readonly rows="${Math.min(newCodes.length,8)+1}" onclick="this.select()">${newCodes.join('\n')}</textarea>`:''}</div>`+
  `<h2>إضافة منتج</h2><div class="c"><select class="in" id="pc">${CATS.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><input class="in" id="pn" placeholder="اسم المنتج (مثال: 660 UC)"><input class="in" id="pg" placeholder="اللعبة / الخدمة"><input class="in" id="pp" type="number" step="any" placeholder="السعر بالدولار"><input class="in" id="pi" placeholder="إيموجي (اختياري)"><button class="p" onclick="addProd()">إضافة</button></div>`+
  products.map(p=>`<div class="c row"><span>${esc(p.icon||'🎮')} ${esc(p.name)} · ${money(p.price)}${p.supplier_id?' 🔗':''}<div class="mu">${esc(CATS.find(c=>c[0]===p.cat)?.[1]||'بدون قسم')}</div></span><button class="bad" onclick="delProd(${p.id})">حذف</button></div>`).join('')+
  `${supSection()}${custSection()}<h2>إعدادات المتجر</h2><div class="c"><div class="mu">شريط الأخبار المتحرك (اتركه فارغاً لإخفائه)</div><textarea class="in" id="s_ticker" rows="2">${esc(S.ticker===undefined?'👑 أهلاً بك في Malek Digital — شحن فوري وآمن لجميع الألعاب والخدمات':S.ticker)}</textarea><div class="mu">ملاحظة نافذة الشراء (اتركها فارغة لإخفائها)</div><textarea class="in" id="s_buynote" rows="2">${esc(S.buynote===undefined?'يتم تنفيذ طلبك بعد المراجعة، وعادةً خلال دقائق.':S.buynote)}</textarea><div class="mu">تعليمات الدفع العامة</div><textarea class="in" id="s_pay" rows="3">${esc(S.pay)}</textarea><div class="mu">رابط الدعم (واتساب أو تيليجرام)</div><input class="in" id="s_support" value="${esc(S.support)}" placeholder="https://wa.me/..."><div class="mu">سعر الصرف: كم ليرة سورية جديدة بالدولار الواحد</div><input class="in" id="s_rate" type="number" step="any" value="${esc(S.rate)}" placeholder="مثال: 120"><div class="mu">وكلاؤنا</div><textarea class="in" id="s_agents" rows="3">${esc(S.agents)}</textarea><div class="mu">الحماية</div><textarea class="in" id="s_safety" rows="3">${esc(S.safety)}</textarea><div class="mu">تحقق الهوية</div><textarea class="in" id="s_kyc" rows="3">${esc(S.kyc)}</textarea><div class="mu">من نحن</div><textarea class="in" id="s_about" rows="3">${esc(S.about)}</textarea><button class="p" onclick="saveSet()">حفظ</button></div>`;
}
async function run(p,okMsg){const r=await p;if(r.error)return toast('تعذر التنفيذ: '+r.error.message);await refresh();if(okMsg)toast(okMsg)}
function addProd(){
  const name=$('#pn').value.trim(),game=$('#pg').value.trim(),price=parseFloat($('#pp').value);
  if(!name||!game||!(price>0))return toast('أكمل الحقول');
  run(SB.from('products').insert({name,game,price,cat:$('#pc').value,icon:$('#pi').value.trim()||'🎮'}));
  ['pn','pg','pp','pi'].forEach(i=>$('#'+i).value='');
}
function delProd(id){run(SB.from('products').delete().eq('id',id))}
function addMethod(){
  const name=$('#mn').value.trim();if(!name)return toast('أدخل الاسم');
  const [c1,c2]=$('#mc').value.split(',');
  run(SB.from('methods').insert({name,sub:$('#ms').value.trim(),icon:$('#mi').value.trim()||'💳',c1,c2,note:$('#mt').value,sort:methods.length+1}));
  ['mn','ms','mi','mt'].forEach(i=>$('#'+i).value='');
}
function saveNote(id){run(SB.from('methods').update({note:$('#n_'+id).value}).eq('id',id),'تم الحفظ')}
function delMethod(id){run(SB.from('methods').delete().eq('id',id))}
function saveSet(){
  let u=$('#s_support').value.trim();if(u&&!/^https?:\/\//.test(u))u='';
  const rows=[['buynote',$('#s_buynote').value],['ticker',$('#s_ticker').value],['pay',$('#s_pay').value],['support',u],['rate',$('#s_rate').value],['agents',$('#s_agents').value],['safety',$('#s_safety').value],['kyc',$('#s_kyc').value],['about',$('#s_about').value]].map(([key,value])=>({key,value}));
  run(SB.from('settings').upsert(rows),'تم الحفظ');
}
async function genCodes(){
  const v=parseFloat($('#cv').value),n=parseInt($('#cn').value||'1');
  if(!(v>0)||!(n>=1&&n<=50))return toast('أدخل القيمة وعدداً من 1 إلى 50');
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',out=[],rows=[];
  for(let i=0;i<n;i++){let c='';crypto.getRandomValues(new Uint8Array(12)).forEach(x=>c+=A[x%32]);rows.push({code_hash:await sha(c),value:v});out.push(c.match(/.{4}/g).join('-'))}
  const r=await SB.from('codes').insert(rows);
  if(r.error)return toast('تعذر إنشاء الأكواد: '+r.error.message);
  newCodes=out;render();
}
let chatOpen=false,msgs=[];
const CHIPS=['كيف أشحن رصيدي؟','وين طلبي؟','رصيدي','كيف أشتري؟','تواصل مع الدعم'];
const nz=t=>t.toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
const supLink=()=>S.support?`<br><a href="${esc(S.support)}" target="_blank" rel="noopener" style="color:#4be38a">💬 تواصل مع الدعم</a>`:'';
function chat(o){
  chatOpen=o;
  if(o&&!msgs.length)msgs.push({r:'b',h:`أهلاً ${esc(prof.name||'')} 👋 أنا مساعد Malek Digital. اسألني عن الشحن أو طلباتك أو رصيدك.`});
  drawChat();
}
function drawChat(){
  $('#cb').className=chatOpen?'o':'';
  $('#cm').innerHTML=msgs.map(m=>`<div class="m ${m.r}">${m.h}</div>`).join('');
  $('#cm').scrollTop=1e6;
  $('#cc').innerHTML=CHIPS.map(c=>`<button onclick="send('${c}')">${c}</button>`).join('');
}
function send(t){
  const i=$('#ci');t=(t||i.value).trim();if(!t)return;i.value='';
  msgs.push({r:'u',h:esc(t)});msgs.push({r:'b',h:answer(t)});drawChat();
}
function answer(t){
  const q=nz(t);
  const KM=[[/شام|sham/,/sham/],[/سيريتل|سريتل|سرياتل|سيرياتل|سرياتيل|سيرياتيل|syriatel/,/syriatel/],[/هرم|haram/,/haram/],[/binance|بينانس/,/binance/],[/bingx|بينجكس|بينغكس/,/bingx/],[/bitget|بيتجيت|بيتغيت/,/bitget/],[/usdt|تيثر/,/^usdt$/]];
  let m=null;
  for(const [a,k] of KM)if(a.test(q)){m=methods.find(x=>k.test(nz(x.name)));if(m)break}
  if(m)return `<b>${esc(m.name)}</b> (${esc(m.sub)})`+(m.min_text?`<br>${esc(m.min_text)}`:'')+(m.acct?`<br>الحساب: <b dir="ltr">${esc(m.acct)}</b>`:'')+`<br>${esc(m.note||S.pay||'').replace(/\n/g,'<br>')}<br>👉 من <a href="#" onclick="go('wallet');chat(false);return false" style="color:#4be38a">اضافة رصيد</a> اختر الطريقة وأرسل رقم العملية.`;
  if(/لعب|ببجي|pubg|فري فاير|فورت|اشتري|شراء|منتج/.test(q))return 'للشراء: 1) افتح <b>المتجر</b> واختر القسم 🏠 2) اضغط <b>شراء</b> على المنتج 3) اكتب معرّف اللاعب وأكّد الطلب. بينخصم من رصيدك بعد التنفيذ، وإذا رصيدك قليل اشحنه أولاً.';
  if(/طلبي|طلباتي|وين|حاله|اوردر|تاخر|متاخر|وصل/.test(q)){
    const l=reqs.filter(r=>r.user_id===me.id).slice(0,3);
    if(!l.length)return 'ما عندك طلبات بعد. افتح المتجر وابدأ أول طلب 🛒';
    const d=r=>r.type==='order'?'🛒 '+esc(r.pname):r.type==='code'?'🎟️ كود شحن':'💰 شحن '+money(r.amount);
    return 'آخر طلباتك:<br>'+l.map(r=>`${d(r)} — <b>${ST[r.status]}</b>`).join('<br>')+(l.some(r=>r.status==='pending')?'<br>الطلبات المعلقة بتنقبل غالباً من دقيقة إلى ساعة.':'')+supLink();
  }
  if(/شحن|اشحن|ايداع|اضافه رصيد|تحويل|دفع/.test(q))return 'بتقدر تشحن رصيدك بهالطرق:<br>'+(methods.map(x=>'• '+esc(x.name)).join('<br>')||'—')+'<br>أو بكود شحن من كرت <b>ادخال كود الشحن</b>.<br>👉 <a href="#" onclick="go(\'wallet\');chat(false);return false" style="color:#4be38a">افتح اضافة رصيد</a>. واسألني عن أي طريقة بالاسم لأعطيك تفاصيلها.';
  if(/رصيدي|رصيدك|كم معي|محفظتي/.test(q))return `رصيدك الحالي: <b>${money(bal())}</b> 💰`;
  if(/كود|بطاقه|كرت/.test(q))return 'اكتب الكود بالكرت الملوّن بأعلى صفحة <b>اضافة رصيد</b> واضغط شحن، وبينضاف الرصيد فوراً. الكود بيشتغل مرة وحدة بس.';
  if(/كم ياخذ|يستغرق|مده|وقت|متى|سرعه|ياخد/.test(q))return 'قبول طلبات الشحن عادةً من دقيقة إلى ساعة. إذا تأخر أكثر، تواصل مع الدعم.'+supLink();
  if(/صرف|دولار|ليره|سوري/.test(q))return rate()>0?`سعر الصرف الحالي: <b>${rate()}</b> ل.س للدولار الواحد.`:'تواصل مع الدعم لمعرفة سعر الصرف.'+supLink();
  if(/دعم|واتساب|تواصل|مشكله|شكوي/.test(q))return 'فريقنا جاهز لمساعدتك 🙌'+(supLink()||'<br>تواصل معنا من صفحة وكلاؤنا.');
  if(/مرحبا|اهلا|هلا|سلام|هاي/.test(q))return 'أهلاً فيك 👋 كيف بقدر أساعدك؟';
  if(/شكرا|يعطيك|تسلم/.test(q))return 'العفو 🌹';
  return 'ما فهمت سؤالك تماماً 🙏 جرّب أحد الأزرار تحت، أو تواصل مع الدعم.'+supLink();
}

const LV=[[0,'برونزي','🥉','#cd7f32','#6e3f12'],[20,'فضي','🥈','#d5dbe5','#5e6a7c'],[50,'ذهبي','🥇','#ffd34d','#a9740a'],[150,'ماسي','💎','#6ee7ff','#3b52ff'],[400,'ملكي','👑','#c084fc','#ff2fb3']];
function totalIn(){return reqs.filter(r=>r.user_id===me.id&&r.status==='done'&&(r.type==='topup'||r.type==='code')).reduce((a,r)=>a+Number(r.amount||0),0)}
function lvl(){const t=totalIn();let i=0;LV.forEach((l,k)=>{if(t>=l[0])i=k});return i}
function memberCard(){
  const t=totalIn(),i=lvl(),l=LV[i],n=LV[i+1];
  const pct=n?Math.min(100,Math.round((t-l[0])/(n[0]-l[0])*100)):100;
  return `<div class="mc" style="--a:${l[3]};--b:${l[4]}"><div class="row"><div class="lv">${l[2]} ${l[1]}</div><div style="font-weight:700">👑 Malek Digital</div></div>
  <div style="margin-top:16px;font-size:20px;font-weight:700">${esc(prof.name||'عميل')}</div>
  <div style="opacity:.9;direction:ltr;text-align:right;letter-spacing:2px">#${esc(String(me.id).slice(0,8).toUpperCase())}</div>
  <div class="row" style="margin-top:12px"><span>إجمالي الشحن: <b>${money(t)}</b></span><span>الرصيد: <b>${money(bal())}</b></span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div style="margin-top:6px;font-size:13px">${n?`باقي <b>${money(n[0]-t)}</b> للوصول إلى ${n[2]} ${n[1]}`:'وصلت لأعلى مستوى 👑'}</div></div>`;
}

let custs=[],notes={},seen=null,sig='';
const reqSig=()=>reqs.map(r=>r.id+r.status).join();
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[880,1175,1568].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.18;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.start(t);o.stop(t+.17)});navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
async function poll(){
  if(!me||!prof.is_admin)return;
  const r=await SB.from('requests').select('*').order('created_at',{ascending:false}).limit(300);
  if(r.error||!r.data)return;
  const ids=new Set(r.data.filter(x=>x.status==='pending').map(x=>x.id));
  const nw=seen?[...ids].filter(i=>!seen.has(i)):[];
  const ns=r.data.map(x=>x.id+x.status).join();
  if(nw.length){beep();const n=await SB.from('profiles').select('id,name,email,balance,banned').order('created_at',{ascending:false});if(n.data){custs=n.data;names=Object.fromEntries(custs.map(x=>[x.id,x.name||x.email||'']))}}
  seen=ids;
  if(ns!==sig){sig=ns;reqs=r.data;render();if(nw.length)toast('🔔 طلب جديد ('+nw.length+')')}
}
setInterval(poll,15000);
function custSection(){
  const f=($('#cq')?.value||'').toLowerCase();
  return `<h2>الزبائن (${custs.length})</h2><input class="in" id="cq" placeholder="بحث بالاسم أو الإيميل ثم Enter" onchange="render()">`+
  custs.filter(c=>!f||((c.name||'')+' '+(c.email||'')).toLowerCase().includes(f)).slice(0,40).map(c=>`<div class="c"><div class="row"><div><b>${esc(c.name||'—')}</b>${c.banned?' 🚫':''}<div class="mu" dir="ltr" style="text-align:right">${esc(c.email)}</div></div><b>${money(c.balance)}</b></div><textarea class="in" id="nt_${c.id}" rows="2" placeholder="ملاحظة خاصة (لا يراها الزبون)">${esc(notes[c.id])}</textarea><div class="row"><button class="p" onclick="saveCNote('${c.id}')">حفظ الملاحظة</button><button class="${c.banned?'ok':'bad'}" onclick="ban('${c.id}',${!c.banned})">${c.banned?'رفع الحظر':'حظر'}</button></div></div>`).join('');
}
async function saveCNote(id){const r=await SB.from('customer_notes').upsert({user_id:id,note:$('#nt_'+id).value});if(r.error)return toast('تعذر الحفظ: '+r.error.message);await refresh();toast('تم حفظ الملاحظة')}
async function ban(id,b){
  if(b&&!confirm('حظر هذا الزبون؟ لن يقدر على الطلب أو الشحن.'))return;
  const r=await SB.rpc('admin_set_ban',{p_user:id,p_ban:b});
  if(r.error)return toast('تعذر التنفيذ: '+r.error.message);
  await refresh();toast(b?'تم الحظر':'تم رفع الحظر');
}

let SUPL=[];
async function fn(body){
  const r=await SB.functions.invoke('alnukhba',{body});
  if(r.error){let m=r.error.message;try{const j=await r.error.context.json();m=(j.error||m)+(j.detail?' '+JSON.stringify(j.detail).slice(0,160):'')}catch(e){}return {err:m}}
  return {data:r.data};
}
function supSection(){
  const q=($('#iq')?.value||'').toLowerCase(),mk=parseFloat($('#im')?.value);
  const k=isNaN(mk)?15:mk;
  const l=SUPL.filter(p=>p.available&&p.qty_values===null&&(!q||(p.name+' '+p.category_name).toLowerCase().includes(q))).slice(0,25);
  return `<h2>المورد: متجر النخبة 🔗</h2><div class="c"><div class="row"><button class="p" onclick="supLoad()">تحميل المنتجات</button><button onclick="supBal()">رصيدي عندهم</button></div>`+
  (SUPL.length?`<select class="in" id="ic">${CATS.map(([c,n])=>`<option value="${c}">${n}</option>`).join('')}</select><input class="in" id="im" type="number" step="any" placeholder="هامش الربح %" value="15"><input class="in" id="iq" placeholder="بحث (مثال: PUBG أو UC) ثم Enter" onchange="render()">`:'')+
  l.map(p=>`<div class="row" style="margin-top:8px"><span style="font-size:14px">${esc(p.name)}<div class="mu">${esc(p.category_name)} · ${p.price}$ ← ${(p.price*(1+k/100)).toFixed(2)}$</div></span><button class="p" onclick="supAdd(${p.id})">إضافة</button></div>`).join('')+`</div>`;
}
async function supLoad(){
  toast('جاري التحميل...');
  const r=await fn({action:'products'});
  if(r.err)return toast('تعذر: '+r.err);
  SUPL=Array.isArray(r.data)?r.data:[];
  if(!SUPL.length)return toast('لم يرجع المورد منتجات: '+JSON.stringify(r.data).slice(0,120));
  render();toast('تم تحميل '+SUPL.length+' منتج');
}
async function supBal(){
  const r=await fn({action:'profile'});
  if(r.err)return toast('تعذر: '+r.err);
  toast('رصيدك عند النخبة: '+(r.data&&r.data.balance!==undefined?r.data.balance:JSON.stringify(r.data).slice(0,100)));
}
function supAdd(id){
  const p=SUPL.find(x=>x.id===id);if(!p)return;
  const mk=parseFloat($('#im').value)||0;
  run(SB.from('products').insert({name:p.name,game:p.category_name,price:Math.round(p.price*(1+mk/100)*100)/100,cat:$('#ic').value,icon:'🎮',supplier_id:p.id}),'تمت الإضافة');
}
async function autoFulfil(id){
  toast('جاري التنفيذ...');
  const r=await fn({action:'fulfil',request_id:id});
  if(r.err)return toast('⚠️ '+r.err);
  await refresh();
  const m={done:'✅ تم التنفيذ وخُصم من رصيد الزبون',rejected:'❌ رفض المورد الطلب',waiting:'⏳ قيد التنفيذ عند المورد، اضغط تحديث الحالة بعد قليل',insufficient:'رصيد الزبون غير كافٍ'};
  toast(m[r.data&&r.data.result]||'تم');
}

init();
</script>
